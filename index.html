<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Joseph">
    <meta name="description" content="Joseph's Professional Portfolio - Web Developer & Designer">
    <meta name="color-scheme" content="dark">
    <title>Joseph - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Prefers reduced motion support for accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <h1>JOSEPH</h1>
                <p class="subtitle">Professional Developer</p>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="#resume">RESUME</a></li>
                    <li><a href="#portfolio">PORTFOLIO</a></li>
                    <li><a href="#contact">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Portfolio</h2>
        </div>
    </section>

    <!-- Portfolio Section -->
    <section class="portfolio" id="portfolio">
        <div class="container">
            <div class="projects-grid">
                <!-- Project 1 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-1.svg" alt="Project 1">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT ONE</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 2 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-2.svg" alt="Project 2">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT TWO</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 3 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-3.svg" alt="Project 3">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT THREE</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 4 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-4.svg" alt="Project 4">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT FOUR</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 5 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-5.svg" alt="Project 5">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT FIVE</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 6 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-6.svg" alt="Project 6">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT SIX</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Joseph. All rights reserved.</p>
    </footer>

    <script>
        // Enhanced interactivity for project cards with touch support
        document.querySelectorAll('.project-card').forEach(card => {
            let touchStartY = 0;

            // Handle click events
            card.addEventListener('click', function() {
                showProjectDetails(this);
            });

            // Handle touch events (prevent accidental clicks on scroll)
            card.addEventListener('touchstart', function(e) {
                touchStartY = e.touches[0].clientY;
            });

            card.addEventListener('touchend', function(e) {
                const touchEndY = e.changedTouches[0].clientY;
                // Only trigger if touch movement is minimal (< 20px vertical)
                if (Math.abs(touchStartY - touchEndY) < 20) {
                    showProjectDetails(this);
                }
            });

            // Add keyboard support for accessibility
            card.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    showProjectDetails(this);
                }
            });
        });

        function showProjectDetails(card) {
            const projectTitle = card.querySelector('h3').textContent;
            alert(`Details for ${projectTitle} coming soon!`);
        }

        // Smooth scroll for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href !== '#') {
                    e.preventDefault();
                    const target = document.querySelector(href);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            });
        });

        // Prevent touch delay on mobile
        document.addEventListener('touchstart', function() {}, { passive: true });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joseph - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <h1>JOSEPH</h1>
                <p class="subtitle">Professional Developer</p>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="#resume">RESUME</a></li>
                    <li><a href="#portfolio">PORTFOLIO</a></li>
                    <li><a href="#contact">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Portfolio</h2>
        </div>
    </section>

    <!-- Portfolio Section -->
    <section class="portfolio" id="portfolio">
        <div class="container">
            <div class="projects-grid">
                <!-- Project 1 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-1.svg" alt="Project 1">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT ONE</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 2 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-2.svg" alt="Project 2">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT TWO</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 3 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-3.svg" alt="Project 3">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT THREE</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 4 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-4.svg" alt="Project 4">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT FOUR</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 5 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-5.svg" alt="Project 5">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT FIVE</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>

                <!-- Project 6 -->
                <div class="project-card">
                    <div class="project-image">
                        <img src="assets/project-6.svg" alt="Project 6">
                    </div>
                    <div class="project-info">
                        <h3>PROJECT SIX</h3>
                        <p class="show-details">SHOW DETAILS ></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Joseph. All rights reserved.</p>
    </footer>

    <script>
        // Add interactivity to project cards
        document.querySelectorAll('.project-card').forEach(card => {
            card.addEventListener('click', function() {
                alert('Project details coming soon!');
            });
        });
    </script>
</body>
</html>
